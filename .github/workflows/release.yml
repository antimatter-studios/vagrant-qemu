name: Build and Release Gem

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Build gem
        run: ruby script/build_gem.rb vagrant-qemu-christhomas

      - name: Configure RubyGems trusted publisher
        uses: rubygems/configure-rubygems-credentials@main
        with:
          gem-server: https://rubygems.org
          audience: rubygems.org

      - name: Publish to RubyGems
        run: gem push vagrant-qemu-christhomas-*.gem

      - name: Upload gem to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vagrant-qemu-christhomas-*.gem
